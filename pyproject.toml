[project]
name = "agentdoc"
version = "0.1.0"
description = "Diagnose why multi-agent LLM systems fail, using the MAST failure taxonomy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shivansh Bhageria", email = "bhageriashivansh.1205@gmail.com" }]
keywords = ["llm", "multi-agent", "debugging", "mast", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "anthropic>=0.40",
    "groq>=1.7.0",
    "python-dotenv>=1.2.3",
]

[project.urls]
Homepage = "https://github.com/Shivansh1205/AgentDoc"
Repository = "https://github.com/Shivansh1205/AgentDoc"
Issues = "https://github.com/Shivansh1205/AgentDoc/issues"

[project.scripts]
agentdoc = "agentdoc.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentdoc"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
